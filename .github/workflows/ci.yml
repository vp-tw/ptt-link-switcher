name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.1
          install_args: node pnpm
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @vp-tw/ptt-link-switcher pack --pack-destination package-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package-artifacts/*.tgz
